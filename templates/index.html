<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 15px 15px 0 0 !important;
        }
        textarea {
            resize: none;
            height: 150px;
        }
        .btn-translate {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .btn-translate:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        .result-card {
            margin-top: 20px;
            display: none;
        }
        .loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header text-center">
                <h2>Language Translator</h2>
                <p class="mb-0">Translate any text to English</p>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="sourceText" class="form-label">Enter text to translate:</label>
                    <textarea class="form-control" id="sourceText" rows="4" placeholder="Type or paste your text here..."></textarea>
                </div>
                <div class="text-center">
                    <button class="btn btn-translate" onclick="translateText()">Translate</button>
                </div>
                
                <div class="loading text-center mt-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>Translating...</p>
                </div>

                <div class="result-card card">
                    <div class="card-body">
                        <h5 class="card-title">Translation Result</h5>
                        <div class="mb-3">
                            <label class="form-label">Original Text:</label>
                            <p id="originalText" class="form-control bg-light"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Translated Text:</label>
                            <p id="translatedText" class="form-control bg-light"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Detected Language:</label>
                            <p id="sourceLanguage" class="form-control bg-light"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function translateText() {
            const text = document.getElementById('sourceText').value.trim();
            if (!text) {
                alert('Please enter some text to translate');
                return;
            }

            // Show loading
            document.querySelector('.loading').style.display = 'block';
            document.querySelector('.result-card').style.display = 'none';

            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('originalText').textContent = data.original_text;
                    document.getElementById('translatedText').textContent = data.translated_text;
                    document.getElementById('sourceLanguage').textContent = data.source_language;
                    document.querySelector('.result-card').style.display = 'block';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error occurred while translating: ' + error.message);
            } finally {
                document.querySelector('.loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
